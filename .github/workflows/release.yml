# This workflow will upload a Python Package to PyPI when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
      - run: uv build

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: release-dists
          path: dist/

  verify:
    # Gate between building and publishing. `release: published` means the
    # GitHub release already exists by the time this runs, so PyPI -- which
    # cannot be un-published -- is the thing worth protecting.
    #
    # Note the trade-off: the integration step depends on QPay's sandbox being
    # up, so an outage there blocks the publish. That is deliberate (we would
    # rather delay a release than ship an unverified one), and re-running this
    # workflow is the fix. Run the `Integration` workflow via workflow_dispatch
    # before cutting a release to find that out early.
    name: Verify the built distribution
    runs-on: ubuntu-latest
    needs:
      - release-build

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Smoke-test the built wheel as a consumer would
        # Deliberately a clean environment with only the wheel installed: the
        # unit suite imports from the source tree, so it cannot catch a module
        # missing from the wheel, absent py.typed, or a stale __version__.
        run: |
          uv venv .smoke-venv
          uv pip install --python .smoke-venv/bin/python dist/*.whl
          .smoke-venv/bin/python scripts/smoke_test.py

      - name: Install dependencies
        run: uv sync

      - name: Integration tests against the QPay sandbox
        # Runs from the source tree: these verify QPay's API still behaves,
        # which the packaging check above has already covered separately.
        # No secrets needed -- the public sandbox merchant is the default.
        env:
          QPAY_RUN_LIVE_TESTS: "1"
        run: uv run pytest -m integration

  pypi-publish:
    runs-on: ubuntu-latest
    needs:
      - release-build
      - verify
    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    # For more information, see: https://docs.github.com/en/actions/deployment/targeting-different-environments/using-environments-for-deployment#deployment-protection-rules
    environment:
      name: release
      # OPTIONAL: uncomment and update to include your PyPI project URL in the deployment status:
      url: https://pypi.org/project/qpay-client/
      #
      # ALTERNATIVE: if your GitHub Release name is the PyPI project version string
      # ALTERNATIVE: exactly, uncomment the following line instead:
      # url: https://pypi.org/project/YOURPROJECT/${{ github.event.release.name }}

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          name: release-dists
          path: dist/

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
