# This workflow will install Python dependencies and run tests across every
# supported Python version.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # The 3.15 leg is advisory: it gives early warning before the release is
    # final, without blocking merges. Remove `experimental` once 3.15 ships and
    # is added to requires-python and the classifiers.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        experimental: [ false ]
        include:
          - python-version: "3.15"
            experimental: true

    steps:
      - uses: actions/checkout@v7
      - name: Install uv and set up Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        # Only the `test` group: the matrix runs pytest, so pulling ruff, ty,
        # coverage and fastapi on every leg was wasted download time.
        run: uv sync --no-default-groups --group test
      - name: Test with pytest
        run: |
          uv run --no-sync pytest
