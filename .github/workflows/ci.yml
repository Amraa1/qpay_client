name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install lint tooling
        run: uv sync --no-default-groups --group lint
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ty check src/
