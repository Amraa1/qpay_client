[project]
name = "qpay-client"
version = "2.0.4"
description = "QPay Integration made easy (async & sync, typed schemas, auto token refresh)"
readme = "README.md"
authors = [{ name = "Amraa1", email = "amarsanaaganbaatar0409@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1", "pydantic>=2.10.0"]
license = { file = "LICENSE.txt" }
keywords = [
  "qpay",
  "payment",
  "qpay v2",
  "mongolian payment",
  "mongolia",
  "httpx",
  "pydantic",
  "asyncio",
]

classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://pypi.org/project/qpay-client/"
Documentation = "https://qpay-client.readthedocs.io/mn/latest/"
Source = "https://github.com/Amraa1/qpay_client"
Issues = "https://github.com/Amraa1/qpay_client/issues"


[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
# Groups are split by *what a CI job actually needs*. A single `dev` group meant
# every leg of the 3.10-3.15 test matrix downloaded ruff and ty (~22 MB) just to
# run pytest, and fastapi, which nothing under tests/ imports.

# Everything required to run the test suite, and nothing else.
test = ["pytest>=9.0.3", "pytest-asyncio>=0.23", "anyio>=4", "respx>=0.21"]

# Static analysis. Runs once, on one Python version -- never across the matrix.
lint = ["ruff~=0.15.0", "ty~=0.0.46"]

# Coverage reporting, also a single-version job.
cov = [{ include-group = "test" }, "pytest-cov>=7.0.0"]

# Used only by examples/quickstart.py. Not imported by the library or the tests.
examples = ["fastapi>=0.121.1"]

# The default group, so a plain `uv sync` still gets the whole toolchain.
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "cov" },
  { include-group = "examples" },
]

[project.optional-dependencies]
docs = ["sphinx>=7.4.7", "sphinx-rtd-theme>=3.0.2"]

[tool.coverage.run]
# Measure the library, not the things that test it. Counting the test suite and
# helper scripts inflates the total and, worse, makes an intentionally
# unexercised branch in a conftest look like a coverage regression in the
# package itself.
source = ["src/qpay_client"]
branch = true
